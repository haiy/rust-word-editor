[package]
name = "rust-word"
version = "0.4.1"
edition = "2021"
description = "An offline desktop word processor with a Rust DOCX engine"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "4", default-features = false, features = ["deflate"] }
wry = "0.57"
tao = "0.35"
rfd = "0.15"
tiny_http = "0.12"
muda = "0.21"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
toml = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }

[profile.release]
strip = true
lto = "thin"
